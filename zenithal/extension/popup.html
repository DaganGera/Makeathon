<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Syne'; src: url('fonts/syne.woff2') format('woff2'); font-weight: 400 800; }
  @font-face { font-family: 'Sora'; src: url('fonts/sora.woff2') format('woff2'); font-weight: 100 800; }
  @font-face { font-family: 'JBMono'; src: url('fonts/jbmono.woff2') format('woff2'); font-weight: 100 800; }

  :root {
    --bg: #0a0a13; --surface: #131220; --surface-2: #1a1830;
    --text: #eae8f5; --text-dim: #9b96b8; --text-faint: #6b6690;
    --accent: #8b7bff; --accent-soft: rgba(139,123,255,.16);
    --teal: #52e0c4; --teal-soft: rgba(82,224,196,.14);
    --danger: #ff5c7a; --danger-soft: rgba(255,92,122,.14);
    --warn: #ffb454; --warn-soft: rgba(255,180,84,.14);
    --border: rgba(255,255,255,.09);
  }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Sora', system-ui, sans-serif; font-size: 13px;
  }
  ::selection { background: var(--accent-soft); }

  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #8b7bff, #f056c7);
    display: grid; place-items: center; font-family: 'Syne'; font-weight: 800; font-size: 12px; color: #0a0a13;
  }
  header .name { font-family: 'Syne'; font-weight: 800; font-size: 14.5px; line-height: 1.1; }
  header .tag { font-family: 'JBMono'; font-size: 8.5px; letter-spacing: .1em; color: var(--text-faint); text-transform: uppercase; }
  header .spacer { flex: 1; }

  .status-row {
    padding: 8px 16px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--border);
    font-family: 'JBMono'; font-size: 10px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .status-row .label { color: var(--text-dim); }

  .body { padding: 14px 16px; }
  input#url {
    width: 100%; box-sizing: border-box; padding: 10px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12px; font-family: 'JBMono'; outline: none;
  }
  input#url:focus { border-color: var(--accent); }
  button#scan {
    margin-top: 9px; width: 100%; padding: 10px; border: 0; border-radius: 9px; cursor: pointer;
    background: linear-gradient(135deg, #8b7bff, #f056c7); color: #0a0a13; font-weight: 700; font-size: 13px;
    font-family: 'Sora';
  }
  button#scan:disabled { opacity: .6; cursor: default; }
  button#scan:hover:not(:disabled) { filter: brightness(1.08); }

  .verdict-card {
    margin-top: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 13px 14px;
  }
  .verdict-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge {
    font-family: 'JBMono'; font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; letter-spacing: .03em;
  }
  .badge.MALICIOUS { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(255,92,122,.4); }
  .badge.SUSPICIOUS { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(255,180,84,.4); }
  .badge.SAFE { background: var(--teal-soft); color: var(--teal); border: 1px solid rgba(82,224,196,.4); }
  .badge.ERROR { background: rgba(155,150,184,.14); color: var(--text-dim); border: 1px solid var(--border); }
  .score { font-family: 'Syne'; font-weight: 800; font-size: 17px; }
  .threat-type { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; }
  .facts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .fact {
    font-family: 'JBMono'; font-size: 9.5px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .reasons { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .reasons li { display: flex; gap: 6px; font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }
  .reasons li::before { content: "▸"; color: var(--accent); flex: none; }

  footer {
    padding: 8px 16px; border-top: 1px solid var(--border); text-align: center;
    font-family: 'JBMono'; font-size: 9px; letter-spacing: .08em; color: var(--text-faint); text-transform: uppercase;
  }
</style>
</head>
<body>
  <header>
    <span class="mark">Z</span>
    <div>
      <div class="name">Zenithal</div>
      <div class="tag">URL Threat Guard</div>
    </div>
    <span class="spacer"></span>
  </header>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span class="label" id="statusLabel">Checking…</span>
  </div>

  <div class="body">
    <input id="url" placeholder="URL to scan (defaults to current tab)" />
    <button id="scan">Scan URL</button>
    <div id="out"></div>
  </div>

  <footer>SIH25229 · The Zenithal</footer>

  <script src="popup.js"></script>
</body>
</html>
